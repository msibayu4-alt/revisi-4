<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Undangan Acara</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Playfair Display', serif;
      background: #ffffff;
      color: #222;
      text-align: center;
      scroll-behavior: smooth;
    }

    section {
      padding: 100px 20px;
    }

    /* ===== HEADLINE ===== */
    h1 {
      font-size: 48px;
      color: #d4af37;
      letter-spacing: 4px;
      text-shadow: 0 0 15px rgba(212,175,55,0.6);
      animation: goldGlow 2.5s infinite ease-in-out;
    }

    @keyframes goldGlow {
      0%, 100% { text-shadow: 0 0 10px #d4af37; }
      50% { text-shadow: 0 0 30px #ffd700; }
    }

    p {
      margin-top: 20px;
      font-size: 18px;
    }

    /* ===== RSVP BUTTON ===== */
    .rsvp-btn {
      display: inline-block;
      margin-top: 50px;
      padding: 16px 40px;
      font-size: 18px;
      font-weight: bold;
      color: #d4af37;
      border: 2px solid #d4af37;
      border-radius: 50px;
      text-decoration: none;
      letter-spacing: 3px;
      transition: all 0.3s ease;
      animation: blinkGold 2s infinite;
    }

    .rsvp-btn:hover {
      background: linear-gradient(45deg, #f9e076, #d4af37);
      color: #000;
      box-shadow: 0 0 25px rgba(212,175,55,0.8);
      transform: scale(1.1);
    }

    @keyframes blinkGold {
      0%, 100% {
        box-shadow: 0 0 5px rgba(212,175,55,0.4);
      }
      50% {
        box-shadow: 0 0 20px rgba(212,175,55,1);
      }
    }

    /* ===== RSVP FORM ===== */
    #rsvp {
      background: #fafafa;
    }

    form {
      max-width: 400px;
      margin: auto;
      background: #fff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }

    form h2 {
      color: #d4af37;
      margin-bottom: 30px;
    }

    input, button {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background: #d4af37;
      border: none;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #ffd700;
      box-shadow: 0 0 15px rgba(212,175,55,0.8);
    }

    footer {
      padding: 30px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>

<body>

  <!-- HERO -->
  <section id="home">
    <h1>UNDANGAN ACARA</h1>
    <p>Kami mengundang Anda untuk hadir</p>

    <a href="#rsvp" class="rsvp-btn">RSVP</a>
  </section>

  <!-- RSVP -->
  <section id="rsvp">
    <form>
      <h2>RSVP</h2>
      <input type="text" placeholder="Nama Anda" required>
      <input type="number" placeholder="Jumlah Hadir" required>
      <button type="submit">Kirim RSVP</button>
    </form>
  </section>

  <footer>
    © 2026 Undangan Digital
  </footer>

</body>
</html>
