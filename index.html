<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Undangan Ulang Tahun</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --gold: #c9a45c;
  --gold-bright: #e6cf8a;
  --bg: #f4f4f4;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: #444;
}

/* CARD */
.card {
  max-width: 420px;
  margin: 40px auto;
  background: #ffffff;
  padding: 44px 32px;
  border-radius: 22px;
  box-shadow: 0 18px 50px rgba(0,0,0,0.08);
  text-align: center;
  position: relative;
  overflow: hidden;
}

/* BLINK */
.blink {
  position: absolute;
  pointer-events: none;
  animation: blink 3.8s infinite ease-in-out;
}

.blink::before,
.blink::after {
  content: "";
  position: absolute;
  background: linear-gradient(to right, transparent, var(--gold-bright), transparent);
  box-shadow:
    0 0 14px rgba(201,164,92,.9),
    0 0 32px rgba(201,164,92,.6);
}

.blink::before {
  top: 50%;
  left: 0;
  width: 100%;
  height: 3px;
}

.blink::after {
  left: 50%;
  top: 0;
  width: 3px;
  height: 100%;
}

.blink.big   { width: 74px; height: 74px; }
.blink.mid   { width: 56px; height: 56px; }
.blink.small { width: 34px; height: 34px; opacity: .7; }

@keyframes blink {
  0%,100% { opacity: .35; transform: scale(.9); }
  50% { opacity: 1; transform: scale(1.18); }
}

.b1 { top: 14px; left: 14px; }
.b2 { top: 18px; right: 14px; animation-delay:.6s; }
.b3 { top: 110px; left: 4px; animation-delay:1.2s; }
.b4 { top: 160px; right: 4px; animation-delay:1.8s; }
.b5 { bottom: 160px; left: 4px; animation-delay:.9s; }
.b6 { bottom: 110px; right: 4px; animation-delay:1.5s; }
.b7 { bottom: 18px; left: 14px; animation-delay:2.1s; }
.b8 { bottom: 18px; right: 14px; animation-delay:2.6s; }

/* TEXT */
.subtitle {
  letter-spacing: 2px;
  font-size: 12px;
  color: #999;
  margin-bottom: 12px;
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: 40px;
  font-weight: 700;
  margin: 0 0 10px;
  color: var(--gold);
}

.name {
  font-family: 'Playfair Display', serif;
  font-size: 26px;
  margin-top: 20px;
  color: var(--gold);
}

.age {
  font-size: 64px;
  font-weight: 700;
  margin: 10px 0 30px;
  color: var(--gold);
}

.divider {
  width: 60px;
  height: 1px;
  background: rgba(201,164,92,.5);
  margin: 30px auto;
}

.details {
  display: grid;
  gap: 16px;
  font-size: 14px;
  color: #666;
}

/* MAP */
.map-link {
  display: inline-block;
  margin-top: 16px;
  font-size: 13px;
  letter-spacing: 1.4px;
  color: var(--gold);
  text-decoration: none;
  border-bottom: 1px solid rgba(201,164,92,.5);
}

/* RSVP */
.rsvp { margin-top: 34px; }

.rsvp a {
  display: inline-block;
  padding: 12px 38px;
  border: 1px solid var(--gold);
  color: var(--gold);
  border-radius: 999px;
  text-decoration: none;
}

/* FORM */
input, select {
  padding: 12px 16px;
  border-radius: 12px;
  border: 1px solid #ddd;
  font-size: 14px;
}

/* 🔥 TOMBOL RSVP EMAS */
button[type="submit"] {
  padding: 14px;
  border-radius: 999px;
  border: none;
  background: linear-gradient(135deg, var(--gold), var(--gold-bright));
  color: #fff;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(201,164,92,.45);
  transition: all .3s ease;
}

button[type="submit"]:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 28px rgba(201,164,92,.6);
}

button[type="submit"]:active {
  transform: scale(.98);
}

footer {
  margin-top: 36px;
  font-size: 12px;
  color: #999;
}
</style>
</head>

<body>

<div class="card">
  <div class="blink big b1"></div>
  <div class="blink mid b2"></div>
  <div class="blink small b3"></div>
  <div class="blink mid b4"></div>
  <div class="blink small b5"></div>
  <div class="blink mid b6"></div>
  <div class="blink big b7"></div>
  <div class="blink small b8"></div>

  <div class="subtitle">YOU'RE INVITED TO MY</div>
  <h1>Birthday Party</h1>

  <div class="name">KEDY</div>
  <div class="subtitle">is Turning</div>
  <div class="age">17</div>

  <div class="divider"></div>

  <h3 style="font-family:'Playfair Display', serif;">Event Details</h3>

  <div class="details">
    <div>Jumat, 16 Januari 2026</div>
    <div>At 06:00 PM</div>
    <div>Wistara Cafe<br>Jl. Mahendradatta No. 9 Denpasar Barat</div>
  </div>

  <a class="map-link" href="https://maps.app.goo.gl/imsGjJJWZFkVgnGw6" target="_blank">
    VIEW LOCATION ON MAP
  </a>

  <div class="divider"></div>

  <div id="rsvp-form">
    <form onsubmit="sendRSVP(event)" style="display:grid; gap:12px;">
      <input type="text" id="name" placeholder="Nama Anda" required>
      <select id="attendance" required>
        <option value="">Konfirmasi Kehadiran</option>
        <option value="Hadir">Hadir</option>
        <option value="Tidak Hadir">Tidak Hadir</option>
      </select>
      <button type="submit">KIRIM RSVP</button>
    </form>
  </div>

  <footer>Looking forward to celebrating with you!</footer>
</div>

<script>
function sendRSVP(e) {
  e.preventDefault();
  const name = document.getElementById('name').value;
  const attendance = document.getElementById('attendance').value;
  const phone = '6289527441160';
  const message = `Halo, saya ${name}. Saya konfirmasi: ${attendance} di acara ulang tahun.`;
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
}
</script>

</body>
</html>
